name: Release contracts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-release:
    name: deploy-001 contracts (no real smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the PR head (not the event merge commit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run local contracts without installing dependencies
        run: |
          python3 -IB scripts/test-verify-release-ci.py
          python3 -IB scripts/test-stage-smoke-chromium.py
          bash scripts/test-smoke.sh contracts
